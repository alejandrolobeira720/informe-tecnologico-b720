<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Arquitecto Ciberseguro: El Juego</title>
    <link rel="stylesheet" href="backs.css">
    <style>
      /* Navegación fluida con el hub del Informe Tecnológico */
      body { animation: pageIn .35s ease; }
      @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
      body.page-exit { opacity: 0; transition: opacity .22s ease; }
      .volver-hub {
        position: fixed; top: 16px; left: 16px; z-index: 10000;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
        color: #fff; text-decoration: none;
        background: rgba(75,72,70,.85); border: 1px solid rgba(255,255,255,.25);
        border-radius: 100px; padding: 7px 16px;
        transition: border-color .2s, opacity .2s;
      }
      .volver-hub:hover { border-color: rgba(255,255,255,.6); }
    </style>
</head>
<body>

	<a class="volver-hub" href="../index.html" aria-label="Volver al Informe Tecnológico b720">← Informe Tecnológico</a>

	<div id="start-screen">
        <div class="title-box">
            <h1>🏗️ CIBERGAME: El arquitecto atacado</h1>
			<br>
            <h2>Simulador de Ciberseguridad para Arquitectos</h2>
			<br>
            <p>¿Podrás proteger tu estudio antes de la entrega final?</p>
			<br>
        </div>
        
        <button onclick="empezarPartida()" class="btn-start">▶️ JUGAR AHORA</button>
        
        <div class="credits">Creado por Anabel Gil Cabrera</div>
    </div>

    <div id="game-wrapper" style="display: none;">
        
        <header id="stats-bar">
			<div id="lives-container">Vidas: <span id="lives">⛑️⛑️⛑️</span></div>
            
            <div id="level-progress">
                <span id="level-text">Nivel 1 de 5</span>
                <div id="progress-bar-bg">
                    <div id="progress-bar-fill" style="width: 20%;"></div> 
                </div>
            </div>

            <div id="score-container">Rango: <span id="risk-level">Abuelita del CAD 👵</span></div>
        </header>

    <main id="game-screen">
		</main>

        <footer id="interaction-panel">
            <div id="dialogue-box"></div> <div id="action-buttons"></div> 
		</footer>
    </div>
	
	<div id="level-modal" class="modal-overlay" style="display: none;">
		<div class="level-box">
			<div class="level-icon">🏆</div>
			<h2 id="modal-title">¡NIVEL COMPLETADO!</h2>
			<p id="modal-message">Mensaje de victoria...</p>
			<button onclick="continuarJuego()" class="btn-start">SIGUIENTE NIVEL ⏩</button>
		</div>
	</div>

	<script src="backs.js"></script>
	<script>
	  // Fundido de salida al volver al hub
	  document.querySelector(".volver-hub").addEventListener("click", function (e) {
	    e.preventDefault();
	    var href = this.getAttribute("href");
	    document.body.classList.add("page-exit");
	    setTimeout(function () { window.location.href = href; }, 220);
	  });
	  window.addEventListener("pageshow", function (e) {
	    if (e.persisted) document.body.classList.remove("page-exit");
	  });
	</script>
</body>
</html>
